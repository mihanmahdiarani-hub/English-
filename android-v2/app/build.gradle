plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mihan.englishaitutor.v2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mihan.englishaitutor.v2'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '2.0.0-alpha40-current-dialogue-chat'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def media3_version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // Durable network-constrained update checks even when the app is closed;
    // DownloadManager itself owns the large APK transfer.
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.core:core:1.16.0'

    // Real offline Wav2Vec2 CTC acoustic emissions + word-level Viterbi
    // alignment. The ~95 MB English acoustic model downloads once, separately
    // from APK, and stays only inside this app on the device.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'

    // 100% on-device speech-to-text (whisper.cpp). No API key, no cloud billing.
    implementation 'dev.ffmpegkit-maintained:whisper-android:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Free on-device English -> Persian translation fallback.
    implementation 'com.google.mlkit:translate:17.0.3'

    // Gemini lessons through Firebase AI Logic. Firebase project config is entered
    // locally in the app; no Gemini provider secret is compiled into the APK.
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.guava:guava:31.0.1-android'
}
