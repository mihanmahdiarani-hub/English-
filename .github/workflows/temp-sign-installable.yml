name: Build one-off installable APK v1.3.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sign-installable.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download unsigned v1.3.5 artifact
        uses: actions/download-artifact@v4
        with:
          name: EnglishAITutor-v1.3.5-unsigned
          path: unsigned-v135
          repository: mihanmahdiarani-hub/English-
          run-id: 37418173576
          github-token: ${{ github.token }}

      - name: Ensure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" 'build-tools;35.0.0' >/dev/null

      - name: Verify current APK version
        shell: bash
        run: |
          set -euo pipefail
          APK='unsigned-v135/app-release-unsigned.apk'
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='11'"
          echo "$BADGING" | grep -q "versionName='1.3.5'"

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 24)
          echo "TEMP_SIGN_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore /tmp/english-ai-tutor-temp-v135.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias english-ai-tutor \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname 'CN=English AI Tutor Temporary v1.3.5, OU=Personal, O=English AI Tutor, L=Local, C=US'

      - name: Sign APK v1.3.5
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 unsigned-v135/app-release-unsigned.apk EnglishAITutor-v1.3.5-aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/english-ai-tutor-temp-v135.jks \
            --ks-key-alias english-ai-tutor \
            --ks-pass env:TEMP_SIGN_PASS \
            --key-pass env:TEMP_SIGN_PASS \
            --out EnglishAITutor-v1.3.5.apk \
            EnglishAITutor-v1.3.5-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs EnglishAITutor-v1.3.5.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-v1.3.5-installable
          path: EnglishAITutor-v1.3.5.apk
          retention-days: 2
