name: Build one-off installable APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sign-installable.yml'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android build tools
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" 'build-tools;35.0.0' >/dev/null

      - name: Verify current APK version
        shell: bash
        run: |
          set -euo pipefail
          APK='android-dist/english-ai-tutor-unsigned.apk'
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='8'"
          echo "$BADGING" | grep -q "versionName='1.3.2'"

      - name: Generate one-off signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/english-ai-tutor-temp.jks \
            -storepass 'EnglishTutorTemp2026!' \
            -keypass 'EnglishTutorTemp2026!' \
            -alias english-ai-tutor \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname 'CN=English AI Tutor Temporary, OU=Personal, O=English AI Tutor, L=Local, C=US'

      - name: Sign APK v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 android-dist/english-ai-tutor-unsigned.apk EnglishAITutor-v1.3.2-aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/english-ai-tutor-temp.jks \
            --ks-key-alias english-ai-tutor \
            --ks-pass pass:'EnglishTutorTemp2026!' \
            --key-pass pass:'EnglishTutorTemp2026!' \
            --out EnglishAITutor-v1.3.2.apk \
            EnglishAITutor-v1.3.2-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs EnglishAITutor-v1.3.2.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-v1.3.2-installable
          path: EnglishAITutor-v1.3.2.apk
          retention-days: 1
