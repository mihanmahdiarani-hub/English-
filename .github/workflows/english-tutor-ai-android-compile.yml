name: English AI Tutor multi-AI Android compile (no APK publication)
on:
  pull_request:
    branches: [v2-local-first]
    paths:
      - 'android-v2/app/src/main/java/com/mihan/englishaitutor/v2/BackendAiClient.java'
      - 'android-v2/app/src/main/java/com/mihan/englishaitutor/v2/TutorChatActivity.java'
      - 'android-v2/app/src/main/java/com/mihan/englishaitutor/v2/AuroraChatScreen.java'
      - '.github/workflows/english-tutor-ai-android-compile.yml'

permissions:
  contents: read

jobs:
  compile-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Create ephemeral debug key for compile validation only
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Compile Only,O=English AI Tutor,C=US"
      - name: Compile Android Java with zero API calls and no APK upload
        run: gradle -p android-v2 :app:compileDebugJavaWithJavac --stacktrace
