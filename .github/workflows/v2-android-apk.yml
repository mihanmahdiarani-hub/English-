name: English AI Tutor v2 APK

on:
  push:
    branches: [v2-local-first]
    paths:
      - 'android-v2/**'
      - '.github/workflows/v2-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android-v2 :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-v2-alpha1-debug
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
