name: English AI Tutor v2 APK

on:
  push:
    branches: [v2-local-first]
    paths:
      - 'android-v2/**'
      - '.github/workflows/v2-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK tools
        run: echo '/usr/local/lib/android/sdk/cmdline-tools/latest/bin' >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Persist the debug signing key between CI runs (validated cache v1). This makes future APKs
      # installable as updates and keeps the App Check registration stable.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: english-ai-tutor-debug-keystore-v2

      - name: Create persistent debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Alias name:"

      - name: Bundle verified Whisper tiny.en model
        run: |
          mkdir -p android-v2/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o android-v2/app/src/main/assets/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  android-v2/app/src/main/assets/ggml-tiny.en.bin" | sha256sum -c -

      - name: Build debug APK
        run: gradle -p android-v2 :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-v2-alpha14-auto-every-dialogue
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
