name: English AI Tutor v2 APK

on:
  push:
    branches: [v2-local-first]
    paths:
      - 'android-v2/**'
      - '!android-v2/update.json'
      - '.github/workflows/v2-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-v2-android-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK tools
        run: echo '/usr/local/lib/android/sdk/cmdline-tools/latest/bin' >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Persist the debug signing key between CI runs (validated cache v1). This makes future APKs
      # installable as updates and keeps the App Check registration stable.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: english-ai-tutor-debug-keystore-v2

      - name: Create persistent debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Alias name:"

      - name: Verify dialogue selection regression tests
        shell: bash
        run: |
          set -euo pipefail
          SRC='android-v2/app/src/main/java/com/mihan/englishaitutor/v2'
          APP="$SRC/MainActivity.java"
          VIEW="$SRC/AuroraDialogueWindow.java"
          # Ensure these tests exercise the exact rule the APK uses.
          grep -Fq 'DialogueFocus.visibleIndex(' "$APP"
          grep -Fq 'DialogueFocus.shouldAcceptLessonResponse(' "$APP"
          grep -Fq 'int replayIndex = displayedDialogueIndex();' "$APP"
          grep -Fq 'DialogueFocus.windowIndex(' "$VIEW"
          # Regression #1: tutor button explains EXACTLY the purple row.
          grep -Fq 'DialogueFocus.teacherButtonIndex(' "$APP"
          # Regression #2: native Media3 playback can't show a stale tutor.
          grep -Fq 'DialogueFocus.shouldClearOldLesson(' "$APP"
          grep -Fq 'DialogueFocus.needsTeacherPreview(' "$APP"
          grep -Fq 'DialogueFocus.teacherCardMatchesVisible(' "$APP"
          grep -Fq 'ensureTeacherCardMatchesHighlight(index);' "$APP"
          grep -Fq 'onIsPlayingChanged(boolean isPlaying)' "$APP"
          mkdir -p "$RUNNER_TEMP/dialogue-regression-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/dialogue-regression-tests" \
            "$SRC/DialogueFocus.java" \
            'android-v2/tests/com/mihan/englishaitutor/v2/DialogueFocusTest.java'
          java -ea -cp "$RUNNER_TEMP/dialogue-regression-tests" \
            com.mihan.englishaitutor.v2.DialogueFocusTest

      - name: Verify background auto-updater safety and consent tests
        shell: bash
        run: |
          set -euo pipefail
          SRC='android-v2/app/src/main/java/com/mihan/englishaitutor/v2'
          APP="$SRC/AutoUpdater.java"
          REPO="$SRC/UpdateRepository.java"
          WORKER="$SRC/UpdateCheckWorker.java"
          MANIFEST='android-v2/app/src/main/AndroidManifest.xml'
          # The exact tested policy MUST be wired to the actual APK updater.
          grep -Fq 'UpdatePolicy.mayOfferInstallation(' "$APP"
          grep -Fq 'UpdatePolicy.validApkSource(' "$REPO"
          grep -Fq 'UpdateCheckWorker.schedule(' "$APP"
          grep -Fq 'UpdateRepository.checkAndEnqueue(' "$WORKER"
          grep -Fq 'FileProvider.getUriForFile(' "$APP"
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$MANIFEST"
          grep -Fq 'android:resource="@xml/update_file_paths"' "$MANIFEST"
          mkdir -p "$RUNNER_TEMP/updater-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/updater-tests" \
            "$SRC/UpdatePolicy.java" \
            'android-v2/tests/com/mihan/englishaitutor/v2/UpdatePolicyTest.java'
          java -ea -cp "$RUNNER_TEMP/updater-tests" \
            com.mihan.englishaitutor.v2.UpdatePolicyTest

      - name: Verify millisecond dialogue timing, real WAV and clean video overlay
        shell: bash
        run: |
          set -euo pipefail
          SRC='android-v2/app/src/main/java/com/mihan/englishaitutor/v2'
          MAIN="$SRC/MainActivity.java"
          EXTRACT="$SRC/VideoAudioExtractor.java"
          REFINE="$SRC/DialogueTimingRefiner.java"
          ARCHIVE="$SRC/LocalArchiveManager.java"

          # These executable tests must exercise production wiring.
          grep -Fq 'playerView.setUseController(false);' "$MAIN"
          grep -Fq 'SeekParameters.EXACT' "$MAIN"
          grep -Fq 'AudioTimeline.exclusiveEnd(' "$MAIN"
          grep -Fq 'AudioTimeline.contains(' "$MAIN"
          grep -Fq 'AudioTimeline.reconcilePcmFrames(' "$EXTRACT"
          grep -Fq 'AudioTimeline.nearestSpeechEdge(' "$REFINE"
          grep -Fq 'findSentencePause(' "$REFINE"
          grep -Fq 'LocalArchiveManager.markPreciseTiming(' "$MAIN"
          grep -Fq 'LocalArchiveManager.hasPreciseTiming(' "$MAIN"
          grep -Fq 'timeline-pts-v36.ready' "$ARCHIVE"

          mkdir -p "$RUNNER_TEMP/timing-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/timing-tests" \
            "$SRC/AudioTimeline.java" \
            'android-v2/tests/com/mihan/englishaitutor/v2/AudioTimelineTest.java'
          java -ea -cp "$RUNNER_TEMP/timing-tests" \
            com.mihan.englishaitutor.v2.AudioTimelineTest

          # Compile the ACTUAL timing-refinement source (with tiny local
          # stand-ins for the Kotlin Whisper and Android Diagnostics APIs).
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/timing-tests" \
            -d "$RUNNER_TEMP/timing-tests" \
            'android-v2/tests/stubs/com/mihan/englishaitutor/v2/WhisperBridge.java' \
            'android-v2/tests/stubs/com/mihan/englishaitutor/v2/Diagnostics.java' \
            "$REFINE" \
            'android-v2/tests/com/mihan/englishaitutor/v2/DialogueTimingRefinerTest.java'
          java -ea -cp "$RUNNER_TEMP/timing-tests" \
            com.mihan.englishaitutor.v2.DialogueTimingRefinerTest

      - name: Verify real CTC acoustic word alignment and app integration
        shell: bash
        run: |
          set -euo pipefail
          SRC='android-v2/app/src/main/java/com/mihan/englishaitutor/v2'
          APP="$SRC/MainActivity.java"
          ARCHIVE="$SRC/LocalArchiveManager.java"
          MODEL="$SRC/AlignerModelManager.java"
          INFERENCE="$SRC/Wav2VecAlignmentEngine.java"

          # Prevent a fake timer-only implementation passing CTC tests.
          grep -Fq 'Wav2VecAlignmentEngine.align(' "$APP"
          grep -Fq 'LocalArchiveManager.saveTranscript(' "$APP"
          grep -Fq 'scheduleArchivedWordAlignment(' "$APP"
          grep -Fq 'LocalArchiveManager.hasWordAlignment(' "$APP"
          grep -Fq 'new Dialogue(s.getStartMs(), s.getEndMs(), text, words)' "$APP"
          grep -Fq 'wav2vec2-ctc-v1' "$ARCHIVE"
          grep -Fq 'word.startMs' "$ARCHIVE"
          grep -Fq 'MessageDigest.getInstance("SHA-256")' "$MODEL"
          grep -Fq 'model_quantized.onnx' "$MODEL"
          grep -Fq 'session.run(' "$INFERENCE"
          grep -Fq 'CtcWordAligner.align(' "$INFERENCE"
          grep -Fq 'onnxruntime-android:1.22.0' 'android-v2/app/build.gradle'

          mkdir -p "$RUNNER_TEMP/ctc-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/ctc-tests" \
            "$SRC/CtcWordAligner.java" \
            'android-v2/tests/com/mihan/englishaitutor/v2/CtcWordAlignerTest.java'
          java -ea -cp "$RUNNER_TEMP/ctc-tests" \
            com.mihan.englishaitutor.v2.CtcWordAlignerTest

      - name: Verify vocabulary grammar answered questions and keyboard-safe text chat
        shell: bash
        run: |
          set -euo pipefail
          SRC='android-v2/app/src/main/java/com/mihan/englishaitutor/v2'
          GEMINI="$SRC/GeminiLessonService.java"
          MAIN="$SRC/MainActivity.java"
          CHAT="$SRC/TutorChatActivity.java"
          LAYOUT="$SRC/AuroraChatScreen.java"
          FORMAT="$SRC/GeminiTeachingFormat.java"

          # Gemini must request, parse, cache and DISPLAY both aspects,
          # with a paired written answer to any lesson question.
          grep -Fq '"vocabulary"' "$GEMINI"
          grep -Fq '"questionFa"' "$GEMINI"
          grep -Fq '"answerFa"' "$GEMINI"
          grep -Fq 'v5-lexicon-allwords-specialized' "$GEMINI"
          grep -Fq 'GeminiTeachingFormat.render(' "$MAIN"
          grep -Fq 'lesson.vocabulary, lesson.idioms, lesson.grammar' "$MAIN"
          grep -Fq 'lesson.questionFa, lesson.answerFa' "$MAIN"
          grep -Fq 'Wav2VecAlignmentEngine.align(' "$MAIN"

          # Gemini replies are text-only: never overlay automatic narration.
          ! grep -Fq 'speakTutorText(' "$MAIN"
          ! grep -Fq 'tts.speak(' "$MAIN"
          ! grep -Fq 'TextToSpeech' "$CHAT"
          ! grep -Fq 'tts.speak(' "$CHAT"
          ! grep -Fq 'speak(lastAnswer)' "$CHAT"
          ! grep -Fq 'root.addView(hero' "$LAYOUT"
          ! grep -Fq 'root.addView(chips' "$LAYOUT"
          ! grep -Fq 'root.addView(privacy' "$LAYOUT"

          # Fixed composer must follow live IME (keyboard) insets,
          # not just the system navigation bar, with icon-only actions.
          grep -Fq 'WindowInsets.Type.ime()' "$CHAT"
          grep -Fq 'WindowCompat.setDecorFitsSystemWindows' "$CHAT"
          grep -Fq 'SOFT_INPUT_ADJUST_RESIZE' "$CHAT"
          grep -Fq 'root.requestApplyInsets()' "$CHAT"
          grep -Fq 'int bottomInset = Math.max(bars.bottom,' "$CHAT"
          grep -Fq 'root.addView(chatScroll, messages)' "$LAYOUT"
          grep -Fq 'root.addView(composer,' "$LAYOUT"
          grep -Fq 'micButton.setText("🎙")' "$LAYOUT"
          grep -Fq 'sendButton.setText("➤")' "$LAYOUT"

          mkdir -p "$RUNNER_TEMP/gemini-text-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/gemini-text-tests" \
            "$FORMAT" \
            'android-v2/tests/com/mihan/englishaitutor/v2/GeminiTeachingFormatTest.java'
          java -ea -cp "$RUNNER_TEMP/gemini-text-tests" \
            com.mihan.englishaitutor.v2.GeminiTeachingFormatTest

      - name: Verify complete movie vocabulary, specialized categories, transcript export and truly full-screen Gemini chat
        shell: bash
        run: |
          set -euo pipefail
          SRC='android-v2/app/src/main/java/com/mihan/englishaitutor/v2'
          APP="$SRC/MainActivity.java"
          GEMINI="$SRC/GeminiLessonService.java"
          CHAT="$SRC/TutorChatActivity.java"
          LAYOUT="$SRC/AuroraChatScreen.java"
          VOCAB="$SRC/VocabularyActivity.java"
          INDEX="$SRC/VocabularyIndex.java"
          EXPORT="$SRC/TranscriptExport.java"
          ARCHIVE="$SRC/LocalArchiveManager.java"
          MANIFEST='android-v2/app/src/main/AndroidManifest.xml'

          # Full movie words come from the REAL extracted Whisper transcript.
          # Gemini only enriches verified words and contiguous expressions.
          grep -Fq 'VocabularyIndex.build(lines, enrichments,' "$VOCAB"
          grep -Fq 'LocalArchiveManager.openPreparedArchive(this, archiveId)' "$VOCAB"
          grep -Fq 'VocabularyIndex.Category.values()' "$VOCAB"
          grep -Fq 'confirmWholeMovieAnalysis()' "$VOCAB"
          grep -Fq 'gemini.analyzeBatch(batch,' "$VOCAB"
          grep -Fq 'gemini.getCached(' "$VOCAB"
          grep -Fq 'heardInDialogue(line, suggestion.term)' "$INDEX"
          grep -Fq 'class VocabularyActivity' "$VOCAB"
          grep -Fq 'android:name=".VocabularyActivity"' "$MANIFEST"
          grep -Fq 'List<VocabularyIndex.Phrase> lexicalItems' "$GEMINI"
          grep -Fq 'o.put("lexicalItems", lexical)' "$GEMINI"
          grep -Fq 'parseLexicalItems(o.optJSONArray("lexicalItems"))' "$GEMINI"
          grep -Fq 'IDIOM, COLLOCATION, PHRASAL_VERB' "$GEMINI"

          # Export all extracted dialogue rows with original milliseconds.
          # The learner chooses their destination through Android Storage
          # Access Framework. No risky direct path or broad storage permission.
          grep -Fq 'Intent.ACTION_CREATE_DOCUMENT' "$APP"
          grep -Fq 'SAVE_EXTRACTED_TRANSCRIPT' "$APP"
          grep -Fq 'TranscriptExport.render(snapshot, format)' "$APP"
          grep -Fq 'getContentResolver().openOutputStream(destination, "wt")' "$APP"
          grep -Fq 'vocabularyButton.setOnClickListener' "$APP"
          grep -Fq 'exportTextButton.setOnClickListener' "$APP"
          grep -Fq 'Format.SRT' "$APP"
          ! grep -Fq 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"

          # Gemini Chat shows ONLY the current line, in scrollable bubbles.
          # No previous/next subtitles in the UI, Intent or Gemini prompt.
          grep -Fq 'intent.putExtra("current_dialogue", current)' "$APP"
          ! grep -Fq 'intent.putExtra("next_dialogue"' "$APP"
          ! grep -Fq 'intent.putStringArrayListExtra("previous_dialogue"' "$APP"
          ! grep -Fq 'previous_dialogue' "$CHAT"
          ! grep -Fq 'next_dialogue' "$CHAT"
          grep -Fq 'Collections.emptyList()' "$CHAT"
          grep -Fq 'messageList.addView(row' "$CHAT"
          grep -Fq 'bubble.setTextIsSelectable(true)' "$CHAT"
          grep -Fq 'root.addView(chatScroll, messages)' "$LAYOUT"
          grep -Fq 'root.addView(composer,' "$LAYOUT"
          ! grep -Fq 'dialogueContext' "$LAYOUT"
          ! grep -Fq 'root.addView(chips' "$LAYOUT"
          ! grep -Fq 'root.addView(privacy' "$LAYOUT"
          grep -Fq 'WindowInsets.Type.ime()' "$CHAT"
          grep -Fq 'WindowCompat.setDecorFitsSystemWindows' "$CHAT"
          ! grep -Fq 'tts.speak(' "$CHAT"

          mkdir -p "$RUNNER_TEMP/lexicon-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/lexicon-tests" \
            "$INDEX" "$EXPORT" \
            'android-v2/tests/com/mihan/englishaitutor/v2/VocabularyIndexTest.java' \
            'android-v2/tests/com/mihan/englishaitutor/v2/TranscriptExportTest.java'
          java -ea -cp "$RUNNER_TEMP/lexicon-tests" \
            com.mihan.englishaitutor.v2.VocabularyIndexTest
          java -ea -cp "$RUNNER_TEMP/lexicon-tests" \
            com.mihan.englishaitutor.v2.TranscriptExportTest

      - name: Bundle verified Whisper base.en model
        run: |
          mkdir -p android-v2/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o android-v2/app/src/main/assets/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  android-v2/app/src/main/assets/ggml-base.en.bin" | sha256sum -c -

      - name: Build debug APK
        run: gradle -p android-v2 :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-v2-alpha22-teacher-button
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk

      - name: Validate signed APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='android-v2/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 1
          CODE=$(awk '/versionCode/{print $2; exit}' android-v2/app/build.gradle)
          NAME=$(awk -F"'" '/versionName/{print $2; exit}' android-v2/app/build.gradle)
          "$AAPT" dump badging "$APK" | head -n 1 | grep -F "name='com.mihan.englishaitutor.v2' versionCode='$CODE' versionName='$NAME'"
          cp "$APK" EnglishAITutor-v2.apk

      - name: Publish stable signed v2 APK in GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=android-v2-latest
          CODE=$(awk '/versionCode/{print $2; exit}' android-v2/app/build.gradle)
          VERSIONED_APK="EnglishAITutor-v2-${CODE}.apk"
          cp EnglishAITutor-v2.apk "$VERSIONED_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$TAG" --pattern 'EnglishAITutor-v2.apk' --dir "$RUNNER_TEMP/previous"
            OLD="$RUNNER_TEMP/previous/EnglishAITutor-v2.apk"
            CURRENT_CERT=$("$APKSIGNER" verify --print-certs EnglishAITutor-v2.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            if [ -z "$CURRENT_CERT" ] || [ "$CURRENT_CERT" != "$OLD_CERT" ]; then
              echo 'Signing certificate changed: cannot safely update installed English AI Tutor v2.'
              exit 1
            fi
            # Immutable version-addressed download avoids older APK bytes
            # being served from caches under the same stable URL.
            gh release upload "$TAG" "$VERSIONED_APK" --clobber
            # Preserve this historical filename for manual downloads.
            gh release upload "$TAG" EnglishAITutor-v2.apk --clobber
          else
            gh release create "$TAG" "$VERSIONED_APK" EnglishAITutor-v2.apk \
              --target "$GITHUB_SHA" \
              --title 'English AI Tutor v2 - latest APK' \
              --notes 'Signed automatic update channel for English AI Tutor v2' \
              --latest=false
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$VERSIONED_APK"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'EnglishAITutor-v2.apk'

      - name: Publish v2 update metadata only after APK is signed and available
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(awk '/versionCode/{print $2; exit}' android-v2/app/build.gradle)
          NAME=$(awk -F"'" '/versionName/{print $2; exit}' android-v2/app/build.gradle)
          SHA=$(sha256sum EnglishAITutor-v2.apk | awk '{print $1}')
          cat > android-v2/update.json <<EOF
          {
            "versionCode": ${CODE},
            "versionName": "${NAME}",
            "apkUrl": "https://github.com/mihanmahdiarani-hub/English-/releases/download/android-v2-latest/EnglishAITutor-v2-${CODE}.apk",
            "sha256": "${SHA}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-v2/update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified English AI Tutor v2 ${NAME} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:v2-local-first; then exit 0; fi
            git fetch origin v2-local-first
            if ! git rebase origin/v2-local-first; then
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1
