name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null

      - name: Enforce update check on every app open
        shell: bash
        run: |
          set -euo pipefail
          FILE='android-app/app/src/main/java/com/mihan/englishaitutor/MainActivity.java'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/mihan/englishaitutor/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          old = '        checkForUpdate(false);\n'
          if old not in s:
              raise SystemExit('Expected startup update check was not found')
          s = s.replace(old, '        checkForUpdate(true);\n', 1)
          marker = '''    @Override\n    protected void onResume() {\n        super.onResume();\n'''
          replacement = '''    @Override\n    protected void onResume() {\n        super.onResume();\n        checkForUpdate(true);\n'''
          if marker not in s:
              raise SystemExit('onResume marker was not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -n "checkForUpdate(true)" "$FILE"

      - name: Build unsigned release APK
        run: gradle -p android-app :app:assembleRelease --no-daemon

      - name: Publish unsigned APK and update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(awk '/versionCode/{print $2; exit}' android-app/app/build.gradle)
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2; exit}' android-app/app/build.gradle)
          mkdir -p android-dist public/android
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk android-dist/english-ai-tutor-unsigned.apk
          cat > public/android/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://english-ai-tutor-2vki.onrender.com/android/latest.apk",
            "notes": "به‌روزرسانی خودکار English AI Tutor"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-dist/english-ai-tutor-unsigned.apk public/android/update.json
          if git diff --cached --quiet; then
            echo 'No Android binary changes to publish.'
            exit 0
          fi
          git commit -m "Publish Android APK v${VERSION_NAME} [skip android-build]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; rebasing and retrying ($attempt/5)..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Automatic rebase failed; APK publication cannot safely continue.'
              exit 1
            fi
            sleep 2
          done
          echo 'Could not publish APK after 5 attempts.'
          exit 1

      - name: Wait for matching signed APK from Render
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CODE=$(awk '/versionCode/{print $2; exit}' android-app/app/build.gradle)
          EXPECTED_NAME=$(awk -F"'" '/versionName/{print $2; exit}' android-app/app/build.gradle)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo 'aapt not found'
            exit 1
          fi
          rm -f EnglishAITutor.apk
          for i in $(seq 1 90); do
            MANIFEST=$(curl -L -sS --connect-timeout 10 --max-time 20 'https://english-ai-tutor-2vki.onrender.com/android/update.json' || true)
            if echo "$MANIFEST" | grep -Eq "\"versionCode\"[[:space:]]*:[[:space:]]*${EXPECTED_CODE}"; then
              CODE=$(curl -L -sS --connect-timeout 10 --max-time 45 -o EnglishAITutor.apk -w '%{http_code}' 'https://english-ai-tutor-2vki.onrender.com/android/latest.apk' || true)
              if [ "$CODE" = "200" ] && [ -s EnglishAITutor.apk ]; then
                BADGING=$("$AAPT" dump badging EnglishAITutor.apk 2>/dev/null | head -n 1 || true)
                if echo "$BADGING" | grep -q "versionCode='${EXPECTED_CODE}'" && echo "$BADGING" | grep -q "versionName='${EXPECTED_NAME}'"; then
                  echo "Matching signed APK v${EXPECTED_NAME} downloaded from Render."
                  echo "$BADGING"
                  exit 0
                fi
                echo "Render returned a different APK: $BADGING"
              fi
            fi
            rm -f EnglishAITutor.apk
            echo "Waiting for matching Render APK v${EXPECTED_NAME}... attempt $i/90"
            sleep 5
          done
          echo 'Matching signed APK was not available in time.'
          exit 1

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor
          path: EnglishAITutor.apk
          retention-days: 30

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-unsigned
          path: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
