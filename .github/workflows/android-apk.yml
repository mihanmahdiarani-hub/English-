name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'public/**'
      - '!public/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null

      - name: Prepare fully local Android app shell
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR='android-app/app/src/main/assets/www'
          MAIN='android-app/app/src/main/java/com/mihan/englishaitutor/MainActivity.java'

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a public/. "$ASSET_DIR/"

          cat > "$ASSET_DIR/runtime-config.js" <<'EOF'
          (() => {
            const API_ORIGIN = 'https://english-ai-tutor-2vki.onrender.com';
            const LOCAL_HOST = 'appassets.androidplatform.net';
            window.EnglishTutorConfig = Object.freeze({
              apiOrigin: API_ORIGIN,
              localShell: true,
              shellVersion: '1.3.2'
            });

            const nativeFetch = window.fetch.bind(window);
            window.fetch = (input, init) => {
              try {
                if (typeof input === 'string' && input.startsWith('/api/')) {
                  input = API_ORIGIN + input;
                } else if (input instanceof URL && input.origin === location.origin && input.pathname.startsWith('/api/')) {
                  input = new URL(input.pathname + input.search, API_ORIGIN);
                } else if (typeof Request !== 'undefined' && input instanceof Request) {
                  const url = new URL(input.url);
                  if (url.origin === location.origin && url.pathname.startsWith('/api/')) {
                    input = new Request(API_ORIGIN + url.pathname + url.search, input);
                  }
                }
              } catch (_) {}
              return nativeFetch(input, init);
            };

            const NativeWebSocket = window.WebSocket;
            class RoutedWebSocket extends NativeWebSocket {
              constructor(url, protocols) {
                let target = url;
                try {
                  const parsed = new URL(String(url));
                  if (parsed.hostname === LOCAL_HOST && parsed.pathname === '/live') {
                    target = 'wss://english-ai-tutor-2vki.onrender.com/live';
                  }
                } catch (_) {}
                if (protocols === undefined) super(target);
                else super(target, protocols);
              }
            }
            window.WebSocket = RoutedWebSocket;
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path

          asset_dir = Path('android-app/app/src/main/assets/www')
          index = asset_dir / 'index.html'
          html = index.read_text(encoding='utf-8')
          html = html.replace('href="/', 'href="').replace('src="/', 'src="')
          marker = '  <script src="source-library.js'
          if marker not in html:
              raise SystemExit('Could not find local script marker in index.html')
          html = html.replace(marker, '  <script src="runtime-config.js"></script>\n' + marker, 1)
          native_marker = '  <script src="media-learning.js'
          if native_marker not in html:
              raise SystemExit('Could not find media script marker in index.html')
          html = html.replace(native_marker, '  <script src="native-live-mic.js" defer></script>\n' + native_marker, 1)
          index.write_text(html, encoding='utf-8')

          app_js = asset_dir / 'app.js'
          app = app_js.read_text(encoding='utf-8')
          app = app.replace(
              "if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});",
              "// Service worker is intentionally disabled inside the bundled Android shell."
          )
          app_js.write_text(app, encoding='utf-8')

          p = Path('android-app/app/src/main/java/com/mihan/englishaitutor/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'import android.webkit.WebViewClient;\n',
              'import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\n\nimport androidx.webkit.WebViewAssetLoader;\nimport androidx.webkit.WebViewClientCompat;\n',
              1
          )

          old_constants = '''    private static final String APP_URL = "https://english-ai-tutor-2vki.onrender.com";\n    private static final String UPDATE_URL = "https://raw.githubusercontent.com/mihanmahdiarani-hub/English-/main/public/android/update.json";\n'''
          new_constants = '''    private static final String LOCAL_APP_URL = "https://appassets.androidplatform.net/assets/www/index.html";\n    private static final String UPDATE_URL = "https://raw.githubusercontent.com/mihanmahdiarani-hub/English-/main/public/android/update.json";\n'''
          if old_constants not in s:
              raise SystemExit('Expected Android URL constants were not found')
          s = s.replace(old_constants, new_constants, 1)

          old_load = '''        if (savedInstanceState == null) webView.loadUrl(APP_URL);\n        else webView.restoreState(savedInstanceState);\n'''
          if old_load not in s:
              raise SystemExit('Expected remote startup load was not found')
          s = s.replace(old_load, '        webView.loadUrl(LOCAL_APP_URL);\n', 1)

          old_client = '''        webView.setWebViewClient(new WebViewClient() {\n            @Override\n            public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request) {\n                Uri uri = request.getUrl();\n                if (uri != null && uri.getHost() != null && uri.getHost().endsWith("onrender.com")) return false;\n                try {\n                    startActivity(new Intent(Intent.ACTION_VIEW, uri));\n                    return true;\n                } catch (Exception ignored) {\n                    return false;\n                }\n            }\n        });\n'''
          new_client = '''        WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()\n                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))\n                .build();\n\n        webView.setWebViewClient(new WebViewClientCompat() {\n            @Override\n            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n                WebResourceResponse local = assetLoader.shouldInterceptRequest(request.getUrl());\n                return local != null ? local : super.shouldInterceptRequest(view, request);\n            }\n\n            @Override\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {\n                Uri uri = request.getUrl();\n                String host = uri == null ? null : uri.getHost();\n                if ("appassets.androidplatform.net".equals(host)) return false;\n                if (host != null && host.endsWith("onrender.com")) return false;\n                try {\n                    startActivity(new Intent(Intent.ACTION_VIEW, uri));\n                    return true;\n                } catch (Exception ignored) {\n                    return false;\n                }\n            }\n        });\n'''
          if old_client not in s:
              raise SystemExit('Expected WebViewClient block was not found')
          s = s.replace(old_client, new_client, 1)

          field_marker = '    private final Map<String, File> nativeAudioOutputs = new ConcurrentHashMap<>();\n'
          if field_marker not in s:
              raise SystemExit('Native audio field marker was not found')
          s = s.replace(field_marker, field_marker + '    private NativeLiveMic nativeLiveMic;\n', 1)

          bridge_marker = '        webView.addJavascriptInterface(new AndroidMediaBridge(), "AndroidMedia");\n'
          if bridge_marker not in s:
              raise SystemExit('Android bridge marker was not found')
          s = s.replace(bridge_marker,
              '        nativeLiveMic = new NativeLiveMic(this, webView);\n' + bridge_marker,
              1
          )

          extract_marker = '''        @JavascriptInterface\n        public void extractAudio(double startSec, double endSec, String requestId) {\n'''
          native_methods = '''        @JavascriptInterface\n        public String startLiveMic() {\n            if (nativeLiveMic == null) return "{\\"ok\\":false,\\"error\\":\\"Native microphone is unavailable\\"}";\n            return nativeLiveMic.start();\n        }\n\n        @JavascriptInterface\n        public void stopLiveMic() {\n            if (nativeLiveMic != null) nativeLiveMic.stop();\n        }\n\n        @JavascriptInterface\n        public void setLiveMicMuted(boolean muted) {\n            if (nativeLiveMic != null) nativeLiveMic.setMuted(muted);\n        }\n\n'''
          if extract_marker not in s:
              raise SystemExit('extractAudio bridge marker was not found')
          s = s.replace(extract_marker, native_methods + extract_marker, 1)

          destroy_marker = '''        if (webView != null) {\n            webView.removeJavascriptInterface("AndroidMedia");\n'''
          destroy_replacement = '''        if (nativeLiveMic != null) {\n            nativeLiveMic.stop();\n            nativeLiveMic = null;\n        }\n        if (webView != null) {\n            webView.removeJavascriptInterface("AndroidMedia");\n'''
          if destroy_marker not in s:
              raise SystemExit('onDestroy WebView marker was not found')
          s = s.replace(destroy_marker, destroy_replacement, 1)

          # Update checks already run in the native app on start and resume.

          p.write_text(s, encoding='utf-8')
          PY

          grep -n "LOCAL_APP_URL\|raw.githubusercontent.com\|WebViewAssetLoader\|checkForUpdate(true)\|startLiveMic\|NativeLiveMic" "$MAIN"
          test -s "$ASSET_DIR/index.html"
          test -s "$ASSET_DIR/runtime-config.js"
          test -s "$ASSET_DIR/native-live-mic.js"

      - name: Build unsigned release APK
        run: gradle -p android-app :app:assembleRelease --no-daemon

      - name: Upload normal unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-unsigned
          path: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Check availability of existing production signing key
        id: signing_config
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_SIGNING_KEYSTORE_B64:-}" ] && [ -n "${ANDROID_SIGNING_STORE_PASSWORD:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Existing production signing configuration detected.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Production signing key unavailable; building an independently installable preview instead. The existing app and production update channel will not be altered.'
          fi

      - name: Sign APK with the existing production key
        if: steps.signing_config.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/english-ai-tutor-production.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 android-app/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/production-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --out EnglishAITutor.apk \
            "$RUNNER_TEMP/production-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs EnglishAITutor.apk

      - name: Verify signed APK
        if: steps.signing_config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          EXPECTED_CODE=$(awk '/versionCode/{print $2; exit}' android-app/app/build.gradle)
          EXPECTED_NAME=$(awk -F"'" '/versionName/{print $2; exit}' android-app/app/build.gradle)
          test -s EnglishAITutor.apk
          "$APKSIGNER" verify --verbose --print-certs EnglishAITutor.apk
          BADGING=$("$AAPT" dump badging EnglishAITutor.apk | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='${EXPECTED_CODE}'"
          echo "$BADGING" | grep -q "versionName='${EXPECTED_NAME}'"

      - name: Publish signed APK to stable GitHub release
        if: steps.signing_config.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='android-latest'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" EnglishAITutor.apk --clobber
          else
            gh release create "$TAG" EnglishAITutor.apk \
              --target "$GITHUB_SHA" \
              --title 'English AI Tutor - latest signed APK' \
              --notes 'Official signed updates for English AI Tutor.' \
              --latest=false
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'EnglishAITutor.apk'

      - name: Publish version manifest after verified signed release
        if: steps.signing_config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(awk '/versionCode/{print $2; exit}' android-app/app/build.gradle)
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2; exit}' android-app/app/build.gradle)
          APK_SHA256=$(sha256sum EnglishAITutor.apk | awk '{print $1}')
          mkdir -p public/android
          cat > public/android/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/mihanmahdiarani-hub/English-/releases/download/android-latest/EnglishAITutor.apk",
            "sha256": "${APK_SHA256}",
            "notes": "به‌روزرسانی خودکار English AI Tutor؛ فقط نصب را تأیید کنید."
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/android/update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish signed Android APK v${VERSION_NAME} [skip android-build]"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Upload signed APK artifact
        if: steps.signing_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor
          path: EnglishAITutor.apk
          retention-days: 30

      # Never sign or publish the production application with a replacement key.
      # Without the original keystore, make a separate installable app instead,
      # so existing users do not have to uninstall or lose their current data.
      - name: Isolate preview app from the installed production app
        if: steps.signing_config.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android-app/app/build.gradle')
          source = gradle.read_text(encoding='utf-8')
          original = "applicationId 'com.mihan.englishaitutor'"
          assert original in source, 'Production applicationId not found'
          source = source.replace(original, "applicationId 'com.mihan.englishaitutor.preview'", 1)
          source, matches = re.subn(r"versionName\s+'([^']+)'", lambda m: "versionName '" + m.group(1) + "-preview'", source, count=1)
          assert matches == 1, 'Version name not found'
          gradle.write_text(source, encoding='utf-8')

          manifest = Path('android-app/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          assert 'android:label="English AI Tutor"' in xml
          manifest.write_text(xml.replace('android:label="English AI Tutor"', 'android:label="English AI Tutor (Preview)"', 1), encoding='utf-8')

          main = Path('android-app/app/src/main/java/com/mihan/englishaitutor/MainActivity.java')
          java = main.read_text(encoding='utf-8')
          java = java.replace('checkForUpdate(true);', '/* Preview app: production updates disabled. */')
          java = java.replace('checkForUpdate(false);', '/* Preview app: production updates disabled. */')
          main.write_text(java, encoding='utf-8')
          PY
          grep "applicationId 'com.mihan.englishaitutor.preview'" android-app/app/build.gradle

      - name: Build isolated preview release
        if: steps.signing_config.outputs.configured != 'true'
        run: gradle -p android-app :app:assembleRelease --no-daemon

      - name: Sign isolated preview with a temporary, non-production key
        if: steps.signing_config.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 24)
          KEYSTORE="$RUNNER_TEMP/english-ai-tutor-preview.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias preview -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=English AI Tutor Preview, OU=Test, O=English AI Tutor, L=Local, C=US'
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 android-app/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/preview-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" --ks-key-alias preview \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out EnglishAITutor-preview.apk "$RUNNER_TEMP/preview-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs EnglishAITutor-preview.apk
          BADGING=$("$AAPT" dump badging EnglishAITutor-preview.apk | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.mihan.englishaitutor.preview'"

      - name: Upload installable preview APK artifact
        if: steps.signing_config.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-preview-installable
          path: EnglishAITutor-preview.apk
          retention-days: 30

      - name: Publish isolated preview (not a production update)
        if: steps.signing_config.outputs.configured != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='android-preview'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" EnglishAITutor-preview.apk --clobber
          else
            gh release create "$TAG" EnglishAITutor-preview.apk \
              --target "$GITHUB_SHA" \
              --title 'English AI Tutor - isolated Android preview' \
              --notes 'TEST BUILD ONLY: separate com.mihan.englishaitutor.preview app. Does not update or remove the installed English AI Tutor. Each build uses a temporary key; reinstalling this preview may be required for later preview builds.' \
              --latest=false
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'EnglishAITutor-preview.apk'
